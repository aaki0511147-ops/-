function impParse(t){
  var L=String(t||'').split(/\r?\n/),sec='',ings=[],steps=[],serv=0,found=false,fb=[];
  var BU=/^[■□◆◇●○▼▽▲△★☆【\[（(<＜《「『\-–—=＝*＊・･•\s]+/;
  var SUB=/^[【\[＜<▼▽■□◆◇]/;
  L.forEach(function(raw){
    var s=raw.trim();if(!s)return;
    var n=s.normalize('NFKC');
    if(/^(https?:\/\/|www\.)/i.test(n)||/^[#＃]/.test(n))return;
    var h=n.replace(BU,'');
    if(h.length<=24&&h.indexOf('。')<0){
      if(/^(材料|ざいりょう|ingredients?)/i.test(h)){sec='i';found=true;var m=h.match(/(\d+)\s*(人|名|皿|食)/);if(m)serv=+m[1];return}
      if(/^(作り方|つくり方|作りかた|手順|directions?|how to|method)/i.test(h)){sec='s';found=true;return}
      if(SUB.test(n)&&/^(ポイント|コツ|メモ|注意|チャンネル|sns|bgm|お問い合わせ|お仕事|関連|おすすめ|購入|使用|撮影|音楽|レシピ動画|目次)/i.test(h)){sec='x';return}
    }
    if(sec==='i'){
      if(n.length>40||/^\d{1,2}:\d{2}/.test(n))return;
      if(SUB.test(n)&&!/\d/.test(n)&&!/(適量|少々|適宜|お好み)/.test(n))return;
      var x=n.replace(/^[・･•●○◆◇■□▼▽★☆\-–—*＊]+\s*/,'').replace(/^[A-Za-z]\s+(?=\S)/,'').replace(/\([^)]*\)/g,'').replace(/約/g,'').replace(/(\d)\s*と\s*(\d+\/\d+)/g,'$1 $2').replace(/(\d)\s*[~〜]\s*\d+/g,'$1').replace(/[…‥]+|\.{2,}|[:：]/g,' ').trim();
      if(x)parseLegacy(x).forEach(function(i){if(i.n&&i.n.trim())ings.push(i)});
    }else if(sec==='s'){
      var num=/^[①-⑳]/.test(s),st=s.replace(/^[①-⑳]\s*/,'').normalize('NFKC').replace(/^\d{1,2}:\d{2}(?::\d{2})?\s*/,'').trim();
      var q=st.replace(/^(?:\(\d{1,2}\)|\d{1,2}[).．、:：]|手順\s*\d+\s*[:：.．]?|step\s*\d+\s*[:：.．]?)\s*/i,'');
      if(q!==st)num=true;
      st=q.replace(/^[・●○◆◇■□▼▽★☆\-–—*＊]+\s*/,'').trim();
      if(!st)return;
      if(!num&&steps.length&&steps.hasNum){steps[steps.length-1].t+=st;return}
      if(num)steps.hasNum=true;
      var mm=st.match(/(\d+)(?:\s*[~〜]\s*\d+)?\s*分/);
      steps.push({t:st,m:mm?+mm[1]:0});
    }else if(!found&&n.length<=30&&n.indexOf('。')<0){
      var y=n.replace(BU,'').replace(/\([^)]*\)/g,'').replace(/約/g,'').replace(/[…‥]+|\.{2,}|[:：]/g,' ').trim();
      if(y){var p=parseLegacy(y)[0];if(p&&p.n&&(p.a!==''||/^(適量|少々)$/.test(p.u)))fb.push(p)}
    }
  });
  if(!found&&fb.length>=2)ings=fb;
  steps=[].slice.call(steps);
  return{serv:serv,ings:ings,steps:steps};
}
